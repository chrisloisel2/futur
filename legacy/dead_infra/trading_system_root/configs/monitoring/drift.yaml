drift:
  windows:
    fast: { minutes: 5 }
    mid:  { minutes: 60 }
    slow: { hours: 24 }

  features:
    x_fast: ["spread_bps", "depth_usd", "imbalance", "update_rate", "cvd"]
    x_mid:  ["rv_5m", "rv_1h", "return_1m", "atr_14", "rsi_14", "adx_14"]
    s_slow: ["funding", "oi_accel", "liq_pressure", "basis"]

  thresholds:
    psi_warn: 0.15
    psi_crit: 0.25
    js_warn:  0.08
    js_crit:  0.12
    missing_warn: 0.03
    missing_crit: 0.08
    ks_pvalue_warn: 0.01

  baseline:
    s3_prefix: "s3://my-bucket/artifacts/baselines/"
    version: "v1"
