# configs/institutional/risk.yaml
# Risk Engine institutionnel

risk:
  # SEUILS UNIFIÉS 2026-07-19 sur le profil ALPHA20_LOW_RISK
  # (configs/alpha20.yaml) — l'ancien couple 10 %/15 % coexistait avec le
  # governor conservateur à 2,5-3 % ; un seul kill switch désormais : -2,5 %.
  # Limites de perte
  max_day_loss_pct: 0.005       # -0,5%/jour → halt
  max_week_loss_pct: 0.01       # -1%/semaine → halt

  # Drawdown
  max_drawdown_pct: 0.01        # -1% → réduction de taille
  kill_drawdown_pct: 0.025      # -2,5% → kill switch ABSOLU

  # Exposition
  max_gross_exposure_pct: 1.00  # 100% equity max
  max_net_exposure_pct: 1.00
  max_single_asset_pct: 0.40    # 40% max par actif
  max_single_engine_pct: 0.60   # 60% max par engine

  # Pertes consécutives
  max_consecutive_losses: 5
  cooldown_bars_after_losses: 24   # 24h

  # Données stale
  max_stale_data_minutes: 120.0

  # Kill switch manuel
  kill_switch_manual: false

  # State persistence
  state_path: "state/institutional_risk_state.json"
