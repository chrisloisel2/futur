# configs/alpha20_runners.yaml — REGISTRE VERSIONNÉ des runners du tournoi
# ALPHA_20 (ordre 2026-07-20). Régénéré uniquement par
# scripts/build_alpha20_registry.py (jamais édité à la main pour git_commit/
# config_hash — ces champs sont dérivés, DÉTERMINISTES, du bloc `config` de
# chaque entrée + du HEAD git au moment du build). Toute variante hors de ce
# fichier est un balayage de paramètres non autorisé : le tournoi n'exécute
# QUE ce qui est listé ici avec status ACTIVE ou OBSERVE_ONLY.
#
# Limite explicite : les hypothèses économiques sont PRÉ-ENREGISTRÉES ; ce
# fichier n'ajoute aucun clone opportuniste. Chaque runner ACTIVE mécanise un
# mécanisme DÉJÀ validé (carry Δ-neutre V1.1, cash-and-carry BASIS_TERM
# déclaré, consensus MH shadow) — pas une nouvelle hypothèse non testée.

built_at: "2026-07-20T22:28:41.084614+00:00"          # stampé par le script de build
git_commit: "2fe693b"                     # HEAD au moment du build

runners:
