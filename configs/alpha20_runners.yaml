      capital_standalone_eur: 200000.0
      carry_fraction: 0.75
      long_fraction: 0.0645
      max_open_longs: 7
    dependencies:
      - src.institutional.backtest.multileg_backtester
      - src.institutional.engines.registry
      - src.institutional.universe.asset_quality_filter
    config:
      engines_long: [TRM_TREND_INST, PULLBACK_LONG, LIQUIDATION_REBOUND]
      carry_assets: [BTCUSDT, ETHUSDT]
      carry_fraction: 0.75
      long_fraction: 0.0645
      max_open_longs: 7
      enable_asset_regime_gate: true
      enable_regime_flip_exit: true
      enable_intra_position_governor: true
      enable_hedge: true
      enable_ranker: true
      ranker_max_per_bucket: 2
      ranker_max_meme: 1
      ranker_max_alt: 5
      enable_asset_edge_gate: true
      asset_edge_min_net: 0.0
      asset_edge_min_signals: 20
      carry_gate_v2: false            # REJECTED_AS_EXECUTION_GATE (V1.1_BASELINE.md) — jamais réactivé ici

