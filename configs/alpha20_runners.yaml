  - runner_id: carry_basis_v12
    family: carry_basis
    status: ACTIVE
    source: configs/portfolio_v1_2_candidate.yaml
    assets: [BTCUSDT, ETHUSDT]
    venue: binance_usdm
    frequency: "8h (rebalance funding), décision sur barre journalière enrichie"
    features_model: "gate régime BULL/RECOVERY, ranker corrélation/meme/alt et edge gate causal par actif sont des règles déterministes ; engines_long (TRM_TREND_INST, PULLBACK_LONG, LIQUIDATION_REBOUND) exécutent de l'inférence ML gelée (LightGBM/Logistic, pickles pré-entraînés sous artifacts/institutional/...) — aucun réentraînement live"
