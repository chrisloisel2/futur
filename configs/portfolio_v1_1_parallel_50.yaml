  max_net_long_exposure: 0.50
  max_btc_exposure: 0.20
  max_eth_exposure: 0.15
  max_sol_exposure: 0.12
  max_single_alt_exposure: 0.05
  max_bucket_exposure: 0.20
  max_memecoin_exposure: 0.03
  portfolio_dd_reduce: 0.02
  portfolio_dd_kill: 0.03
  max_hourly_new_positions: 2
  max_daily_new_positions: 10

constraints:
  no_real_orders: true
  no_naked_short: true
  no_unvalidated_data: true
  no_missing_funding_for_carry: true

ledgers_dir: artifacts/paper_live/v1_1_parallel_50
