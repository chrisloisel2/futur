    existing_live_alpha: VOL_FORECAST_LAYER_V1
    data_available: "data/options_backfill/deribit"
    execution_available: false

  - candidate_id: WHALE_LSR
    family: positioning
    overlap_family: POSITIONING_STANDALONE
    economic_mechanism: "LSR top-traders extrême-long -> sous-performance (screen SHORT-only)"
    source_round: round2
    source_worker: W10
    discovery_result: "-57.8bps, n=87, p=0.006 -- signe stable 2 moitiés mais N mince"
    current_status: ALREADY_LIVE
    existing_live_alpha: WHALE_LSR_SCREEN_V1
    data_available: "data/positioning"
    execution_available: true   # utilisé comme screen (gate), pas position directe

  # ══════════════════════════ BLOQUÉS / EXPLICITEMENT HORS SCOPE ══════════

  - candidate_id: LIQ_CASCADE_SHORT_SQUEEZE_EXHAUSTION
    family: liquidation
    overlap_family: LIQ_CASCADE_DETECTOR
    economic_mechanism: "ambigu -- deux hypothèses de signe non résolues (voir notes registre existant)"
    source_round: round1_round2
    source_worker: "W2 (round2), forensics session ECONOMIC TRUTH"
    discovery_result: "instable par année (2022 -50.8bps, 2025 +145.5bps outlier) -- signe non résolu, PAS de choix basé sur le PnL"
    current_status: BLOCKED   # reste explicitement bloqué (instruction section 24), toute variante future = nouvelle hypothèse séparée
    existing_live_alpha: LIQ_CASCADE_SHORT_SQUEEZE_EXHAUSTION_V1   # CODE_MISSING dans le registre live
