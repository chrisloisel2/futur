# configs/validation_registry.yaml — VALIDATION_REGISTRY (mission ALPHA
# VALIDATION FACTORY, 2026-09-02).
#
# Inventaire de TOUS les candidats Alpha Hunt (rounds 1-3) suffisamment
# sérieux (PROMISING / NEEDS_FULL_VALIDATION ou mieux) pour entrer dans le
# pipeline de validation indépendante. Ce fichier est SÉPARÉ de
# configs/live_alpha_registry.yaml : celui-ci reste le registre des alphas
# qui ont DÉJÀ un alpha_id/code/freeze -- ce fichier-ci suit des candidats
# EN AMONT de ce statut, avant toute réimplémentation indépendante.
#
# Deux concepts stricts (jamais confondus) :
#   VALIDATED_FOR_FORWARD = validation historique/robustesse suffisante pour
#                            figer une spec (via réimplémentation
#                            indépendante, PAS une simple relecture du code
#                            discovery).
#   FORWARD_CONFIRMED     = preuve obtenue APRÈS freeze, sur données
#                            réellement jamais vues au moment du freeze.
# Une réimplémentation historique n'est JAMAIS une "confirmation forward
# indépendante", même si elle est menée par un worker différent.
#
# current_status ici suit un pipeline propre à ce fichier :
#   CANDIDATE            -> inventorié, réimplémentation pas encore lancée
#   VALIDATING           -> réimplémentation indépendante en cours
#   VALIDATED_FOR_FORWARD -> gate de validation passé (voir section 5 de la
#                            mission), prêt pour freeze automatique
#   REJECTED / DATA_BLOCKED / IMPLEMENTATION_BLOCKED / NEEDS_MORE_RESEARCH
#                         -> n'a pas passé le gate, raison documentée
#
# overlap_family regroupe les variantes corrélées (même risque économique)
# sous un même groupe -- ne JAMAIS les compter comme familles indépendantes
# dans un total (instruction explicite, section 1).

