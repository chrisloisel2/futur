    overlap_family: MICROSTRUCTURE_FAMILY
    economic_mechanism: "OFI/microprice/BBO-imbalance/absorption/cross-venue lead-lag -- aucun standalone convaincant"
    source_round: round3
    source_worker: W6
    discovery_result: "0 PROMISING sur 31 mécanismes testés -- L1 depth-imbalance de round2 ne généralise pas plus profond dans le book, tous les reframings execution-filter sub-cost ou sign-unstable"
