# configs/live_alpha_registry.yaml — LIVE ALPHA LAB registry.
#
# Catalogue de TOUS les candidats crédibles issus de alpha_hunt_2026-08-29 et
# alpha_hunt_2026-08-30 (reports/edge_discovery/), avant toute promotion vers
# le tournoi alpha20 (configs/alpha20_runners.yaml, réservé aux mécanismes
# DÉJÀ validés). Ce fichier suit la même discipline : pas de clone
# opportuniste, chaque entrée correspond à un mécanisme réellement mesuré
# dans un REPORT.md, avec les chiffres attendus figés AU MOMENT DU FREEZE
# (champ expected_*) pour pouvoir calculer edge_retention en live plus tard.
#
# ⚠ CORRECTION DE DISCIPLINE (2026-08-31, instruction utilisateur explicite) :
# le seul champ `status` d'origine mélangeait deux questions différentes —
# "le programme tourne" et "l'alpha est confirmé" — et SHADOW_LIVE donnait une
# fausse impression de validation. Remplacé par DEUX champs orthogonaux :
#
#   scientific_status (où en est la PREUVE) :
#     DISCOVERY            -> mesuré en backtest, spec pas encore figée ici
#     RECONSTRUCTED         -> spec figée MAIS un seuil/paramètre a dû être
#                              reconstruit (grid-search, reverse-engineering,
#                              données de substitution) faute de constante
#                              publiée dans le rapport source — sa confirmation
#                              ne peut PAS s'appuyer sur les données qui ont
#                              servi à la reconstruction ; le compteur forward
#                              repart à zéro à la date de reconstruction
#     FROZEN                -> spec figée AVANT toute observation utilisée
#                              pour la juger (aucune reconstruction)
#     FORWARD_CONFIRMATION  -> assez d'épisodes forward (post-freeze) pour
#                              juger, verdict pas encore rendu
#     CONFIRMED / REJECTED  -> verdict forward rendu
#
#   operational_status (où en est le CODE) :
#     CODE_MISSING | DATA_BLOCKED | SIGNAL_SHADOW | EXECUTION_SHADOW | READY
#     MERGED_INTO_<alpha_id> -> ce candidat n'a PAS de code séparé sous son
#                               propre alpha_id ; son signal est calculé à
#                               l'intérieur d'un layer partagé -- voir
#                               l'alpha_id cité pour le code/ledger réel.
#                               Ajouté 2026-08-31 pour les 3 candidats
#                               OPTIONS_*_V1 -- voir VOL_FORECAST_LAYER_V1.
#
#   Ne jamais lire operational_status=SIGNAL_SHADOW comme une validation —
#   ça dit juste "le signal tourne". Le scoreboard (scripts/
#   compute_live_alpha_lab_scoreboard.py) sépare explicitement
#   replay_decisions (event_time <= freeze_timestamp, backfill historique)
#   de forward_decisions (event_time > freeze_timestamp, jamais vu au
#   moment du freeze) — SEULES ces dernières comptent comme preuve forward.
#
# Toute modification rétroactive d'une entrée FROZEN+/RECONSTRUCTED+ pour
# "sauver" son PnL est interdite — un changement de spec (seuil, univers,
# feature, sizing) devient une NOUVELLE entrée (alpha_id avec suffixe _V2,
# nouvelle freeze_timestamp, track record à zéro). Aucune décision passée
# n'est jamais réécrite ou supprimée — seule l'addition de nouvelles colonnes
# (ex. `provenance`) ou de nouvelles lignes est permise sur un ledger existant.
#
# ⚠ BUG POLICY (2026-08-31, instruction utilisateur, phase PORTFOLIO FORWARD) :
# tout bug pouvant modifier signal/feature/univers/instrument mapping/position/
# exécution/frais/PnL est TOUJOURS in-scope, jamais "known bug but continue".
# Deux issues seulement : FIX + test de regression + nouveau segment forward
# si nécessaire (voir `data_segment_boundaries` sur les entrées concernées),
# OU bloquer la stratégie (scientific_status reste DISCOVERY/operational_status
# CODE_MISSING tant que non résolu). Exemple déjà appliqué : le bug de
# résolution de symboles (MKR/PEPE/RNDR) a été corrigé le jour même de sa
# découverte plutôt que documenté et laissé tel quel.

