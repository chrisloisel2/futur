# Configuration OPTIMISÉE pour entraînement S3 avec 16GB RAM
# Utilisation: python ai/train.py --config ai/configs/train_s3_optimized.yaml --device mps

data:
  # Source de données
  data_source: "s3"
  s3_bucket: "qbia"
  s3_prefix: "bourse/mintrad"

  # OPTIMISATION: 2 années au lieu de 5 (2023-2024)
  start_year: 2023
  end_year: 2024

  # OPTIMISATION: 3 symboles principaux au lieu de 8
  symbols_filter:
    - "BTCUSDT"   # Bitcoin - le plus important
    - "ETHUSDT"   # Ethereum - 2ème plus important
    - "BNBUSDT"   # Binance Coin

  # Cache local
  local_cache_dir: "/tmp/trading_data_cache"

  # Paramètres de split
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15

  # OPTIMISATION: Réduction modérée des paramètres
  lookback_window: 60      # Réduit de 100 à 60
  feature_dim: 52
  batch_size: 16           # Réduit de 32 à 16

  # Autres paramètres
  shuffle: true
  use_synthetic_data: false

model:
  type: "multi_modal"
  params:
    d_model: 384           # Réduit de 512 à 384
    n_heads: 8
    n_layers: 4            # Réduit de 6 à 4
    dropout: 0.1
    feature_dim: 52

training:
  epochs: 30               # Réduit de 50 à 30
  learning_rate: 0.0001
  checkpoint_dir: "checkpoints_s3_optimized"
  gradient_accumulation_steps: 8  # Compense batch 16 → batch effectif 128
  limit_batches: 500       # Limite pour debug

  # Pour vérifier que ça passe sans OOM
  # limit_batches: 100
