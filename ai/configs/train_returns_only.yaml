# Configuration Optimisée - Returns Prediction Only
# Direction désactivée temporairement pour diagnostiquer le problème
# Focus sur prédiction des returns avec architecture stable

# =====================================
# DATA CONFIGURATION
# =====================================
data:
  bucket: "qbia"
  base_prefix: "bourse/processed/market/interval=1m/quote=USDT/symbol=BTCUSDT"

  # Years to use for training (will be split 90% train / 10% val internally if needed)
  years_train: [2017, 2018, 2019, 2020, 2021, 2022, 2023]

  # Years to use for testing (final evaluation)
  years_test: [2024]

# =====================================
# MODEL CONFIGURATION
# =====================================
model:
  # Windowing
  lookback: 256        # Number of timesteps to look back (256 minutes = ~4.3 hours)
  horizon: 12          # Number of timesteps to predict ahead (12 minutes)
  stride: 12           # Stride for sliding window (12 = less windows, less RAM)

  # Architecture (RESTORED pour avoir assez de capacité)
  d_model: 128         # Hidden dimension (restored from 64)
  n_heads: 4           # Number of attention heads (restored from 2)
  d_ff: 256            # Feedforward hidden dimension (restored from 128)
  dropout: 0.15        # Dropout rate (modéré pour éviter underfitting)

  # Recursive Memory Module
  mem_dim: 128         # Memory dimension (restored from 64)
  mem_update_iters: 2  # Number of recursive refinement iterations (restored from 1)

# =====================================
# TRAINING CONFIGURATION
# =====================================
training:
  # Batch and data loading
  batch_size: 128          # Batch size (garder pour économiser RAM)
  shuffle_buffer: 10000    # Shuffle buffer size
  prefetch: 2              # Number of batches to prefetch

  # Optimizer (STABLE)
  lr: 0.0003               # Base learning rate (REDUCED back to stable value)
  weight_decay: 0.0001     # AdamW weight decay (REDUCED - trop de régularisation tue le signal)
  clip_norm: 1.0           # Gradient clipping norm (RESTORED to 1.0)

  # Training schedule
  epochs: 20               # Number of epochs
  steps_per_epoch: 500     # Steps per epoch
  val_steps: 100           # Validation steps per epoch

  # Reproducibility
  seed: 1337

# =====================================
# LOSS WEIGHTS
# =====================================
loss_weights:
  w_ret: 1.0    # Returns prediction weight (FOCUS SUR RETURNS)
  w_dir: 0.0    # Direction DÉSACTIVÉE temporairement (était 1.5)
  w_rv: 0.0     # Realized volatility DÉSACTIVÉE (impossible à prédire depuis le passé)

# =====================================
# OUTPUT CONFIGURATION
# =====================================
output:
  base_dir: "training_output_returns_only"
  tensorboard_dir: "training_output_returns_only/tensorboard"
  checkpoints_dir: "training_output_returns_only/checkpoints"
  metrics_dir: "training_output_returns_only/metrics"
  logs_dir: "training_output_returns_only/logs"
