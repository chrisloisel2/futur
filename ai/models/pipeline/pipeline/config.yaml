# Pipeline Configuration

data_sources:
  ccxt:
    exchange: "binance"
    default_limit: 1000
    max_retries: 5
    backoff_factor: 2.0
    circuit_breaker_threshold: 5
    circuit_breaker_timeout: 300

  glassnode:
    base_url: "https://api.glassnode.com/v1/metrics"
    cache_ttl: 900

symbols:
  - "BTC/USDT"
  - "ETH/USDT"

timeframes:
  primary: "1h"
  alternatives:
    - "4h"
    - "1d"

cache:
  redis:
    url: "redis://localhost:6379/0"
    ttl_seconds: 300
    timeout: 2.0
    max_retries: 3
    reconnect_backoff: 1.0

normalization:
  window: 500
  z_threshold: 4.0
  eps: 1e-9
  method: "robust"  # 'robust' or 'standard'

features:
  windows:
    sma: [5, 10, 20, 50, 100, 200]
    ema: [8, 12, 21, 34, 55, 89]
    rsi: [7, 14, 21, 30]
    volatility: [7, 14, 21, 30, 60]
    returns: [1, 4, 12, 24]

  lag_periods: [1, 7, 30]
  drop_na: true

memory:
  optimize_dtypes: true
  aggressive_optimization: false
  downsample_old_data: true
  recent_periods: 1000
  downsample_freq: "1D"

data_quality:
  max_gap_multiplier: 2.0
  volatility_threshold: 10.0  # %
  price_change_threshold: 0.5  # 50%
  enable_validation: true

logging:
  level: "INFO"
  format: "json"  # 'json' or 'text'
  file: "pipeline.log"
  rotation: "1 day"
  retention: "7 days"
