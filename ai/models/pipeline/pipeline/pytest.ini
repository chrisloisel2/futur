[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=pipeline
    --cov-report=term-missing
    --cov-report=html
markers =
    integration: integration tests (deselect with '-m "not integration"')
    slow: slow running tests
