data:
  symbols: ['BTC/USDT', 'ETH/USDT']
  timeframe: '1h'
  lookback_window: 100
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  features:
    technical: ['rsi', 'macd', 'bollinger', 'volume_profile']
    onchain: ['active_addresses', 'exchange_flows']
    temporal: ['hour_of_day', 'day_of_week']

model:
  name: 'MultiModalTradingTransformer'
  params:
    d_model: 256
    n_heads: 8
    num_layers: 6
    dropout: 0.1
    feature_dim: 128
  branches:
    temporal: 'NonStationaryTransformer'
    tabular: 'FTTransformer'
    fusion: 'CrossModalAttention'

training:
  epochs: 100
  batch_size: 32
  learning_rate: 0.001
  optimizer: 'AdamW'
  scheduler: 'CosineAnnealingWarmRestarts'
  loss_fn: 'SharpeLoss'
  early_stopping_patience: 10
  gradient_clip: 1.0
  checkpoint_dir: './checkpoints'

metrics:
  primary: 'sharpe_ratio'
  secondary: ['max_drawdown', 'calmar_ratio', 'profit_factor']
  tracking_frequency: 100
