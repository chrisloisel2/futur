# TRM STABLE Configuration File
# Optimized for numerical stability and realistic predictions
# All anti-explosion rules applied

# Data Configuration
data:
  # S3 settings
  s3_bucket: "qbia"
  s3_prefix: "bourse/mintrad"
  start_year: 2020
  end_year: 2024

  # Symbol selection
  symbols: null
  symbol_filter: "BTCUSDT"

  # Local cache
  cache_dir: "./cache/s3_data"

  # Feature engineering
  normalize: true
  lookback_window: 60  # 1 hour for 1-minute bars
  prediction_horizon: 1  # Predict next timestep (1-minute return)

  # Data splits (temporal, no shuffle)
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

# Model Configuration
model:
  # TRM architecture - ULTRA CONSERVATIVE for stability
  num_features: null  # Auto-determined
  latent_dim: 32      # Latent state dimension
  hidden_dim: 64      # Hidden layer dimension
  num_iterations: 3   # REDUCED from 5 - limits gradient accumulation
  dropout: 0.1
  output_mode: "return"  # Continuous prediction with tanh + clamp

  # Ensemble disabled for initial stability tests
  use_ensemble: false
  num_ensemble_models: 3

# Loss Configuration - CORRECTED for realistic Sharpe
loss:
  # Composite loss weights
  alpha: 1.0   # Directional loss
  beta: 0.5    # Magnitude-weighted MSE
  gamma: 0.2   # Trading cost penalty
  delta: 0.3   # Drawdown penalty

  # Trading simulation parameters
  trading_fee: 0.001  # 0.1% per trade
  max_acceptable_drawdown: 0.10  # 10%
  magnitude_temperature: 1.0

  use_adaptive_loss: false

# Training Configuration - ULTRA CONSERVATIVE
training:
  # Optimization - ULTRA LOW LR for GRU stability
  learning_rate: 1e-5  # ULTRA LOW - prevents GRU explosion
  weight_decay: 1e-5
  batch_size: 128
  max_epochs: 100

  # Regularization - STRICT gradient clipping
  grad_clip_norm: 0.5  # REDUCED from 1.0 - more aggressive

  # Early stopping
  patience: 20
  monitor_metric: "sharpe_ratio"

  # Learning rate scheduling
  use_cosine_annealing: true
  lr_min_factor: 0.01

  # CRITICAL: AMP DISABLED for numerical stability
  use_amp: false

  # Checkpointing
  checkpoint_dir: "./checkpoints"
  save_best_only: false

# Evaluation Configuration
evaluation:
  initial_capital: 1.0
  risk_free_rate: 0.0  # Simplified Sharpe

  walk_forward:
    enabled: false
    train_window_size: 10000
    test_window_size: 1000
    step_size: 1000
    max_windows: null

  generate_plots: true
  plot_dir: "./plots"

# Robustness Testing
robustness:
  test_timeframes: true
  aggregation_factors: [5, 15]

  test_noise: true
  noise_levels: [0.0005, 0.001, 0.002]

  test_data_reduction: false
  data_fractions: [0.1, 0.25, 0.5, 1.0]

  test_asset_transfer: false
  transfer_assets: ["ETHUSDT", "BNBUSDT", "SOLUSDT"]

  test_crisis: true
  volatility_threshold: 0.005

# Hardware Configuration
hardware:
  device: "auto"  # Mac ARM detection applied
  num_workers: 0
  pin_memory: false  # Disabled for CPU/MPS stability

# Logging Configuration - VERBOSE for debugging
logging:
  level: "INFO"
  log_file: "./logs/trm_training_stable.log"
  log_to_console: true
  tensorboard: false
  tensorboard_dir: "./runs"

# Random Seed
seed: 42
