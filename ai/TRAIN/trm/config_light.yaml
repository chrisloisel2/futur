# TRM Configuration File (lightweight variant)

data:
  s3_bucket: "qbia"
  s3_prefix: "bourse/mintrad"
  start_year: 2024
  end_year: 2024
  symbols: ["BTCUSDT", "ETHUSDT", "SOLUSDT"]
  symbol_filter: null
  cache_dir: "./cache/s3_data_light"
  normalize: true
  lookback_window: 60
  prediction_horizon: 1
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

model:
  num_features: null
  latent_dim: 24
  hidden_dim: 48
  num_iterations: 4
  dropout: 0.1
  output_mode: "return"
  use_ensemble: false
  num_ensemble_models: 3

loss:
  alpha: 1.0
  beta: 0.5
  gamma: 0.2
  delta: 0.3
  trading_fee: 0.001
  max_acceptable_drawdown: 0.10
  magnitude_temperature: 1.0
  use_adaptive_loss: false

training:
  learning_rate: 1e-4
  weight_decay: 1e-5
  batch_size: 96
  max_epochs: 20
  grad_clip_norm: 1.0
  patience: 10
  monitor_metric: "sharpe_ratio"
  use_cosine_annealing: true
  lr_min_factor: 0.05
  use_amp: false
  checkpoint_dir: "./checkpoints_light"
  save_best_only: true

evaluation:
  initial_capital: 1.0
  risk_free_rate: 0.02
  walk_forward:
    enabled: false
    train_window_size: 6000
    test_window_size: 600
    step_size: 600
    max_windows: null
  generate_plots: true
  plot_dir: "./plots_light"

robustness:
  test_timeframes: true
  aggregation_factors: [5, 15]
  test_noise: true
  noise_levels: [0.0005, 0.001]
  test_data_reduction: false
  data_fractions: [0.25, 0.5, 1.0]
  test_asset_transfer: false
  transfer_assets: ["ETHUSDT", "SOLUSDT"]
  test_crisis: true
  volatility_threshold: 0.006

hardware:
  device: "auto"
  num_workers: 0
  pin_memory: true

logging:
  level: "INFO"
  log_file: "./logs/trm_training_light.log"
  log_to_console: true
  tensorboard: false
  tensorboard_dir: "./runs_light"

seed: 42
