# TRM Configuration File

# Data Configuration
data:
  # S3 settings
  s3_bucket: "qbia"
  s3_prefix: "bourse/mintrad"
  start_year: 2020
  end_year: 2024

  # Symbol selection (null = auto-discover all symbols)
  symbols: null  # or ["BTCUSDT", "ETHUSDT", "BNBUSDT"]
  symbol_filter: "BTCUSDT"  # Train on single symbol (null for multi-symbol)

  # Local cache
  cache_dir: "./cache/s3_data"

  # Feature engineering
  normalize: true
  lookback_window: 60  # 1 hour for 1-minute bars
  prediction_horizon: 1  # Predict next timestep

  # Data splits (temporal, no shuffle)
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

# Model Configuration
model:
  # TRM architecture (intentionally tiny!)
  num_features: null  # Auto-determined from features
  latent_dim: 32      # Latent state dimension (KEEP SMALL)
  hidden_dim: 64      # Hidden layer dimension
  num_iterations: 5   # Recursive reasoning iterations
  dropout: 0.1
  output_mode: "return"  # "return" or "classification"

  # Ensemble (optional)
  use_ensemble: false
  num_ensemble_models: 3

# Loss Configuration
loss:
  # Composite loss weights
  alpha: 1.0   # Directional loss
  beta: 0.5    # Magnitude-weighted MSE
  gamma: 0.2   # Trading cost penalty
  delta: 0.3   # Drawdown penalty

  # Trading simulation parameters
  trading_fee: 0.001  # 0.1% per trade
  max_acceptable_drawdown: 0.10  # 10%
  magnitude_temperature: 1.0

  # Alternative: adaptive loss (learns weights)
  use_adaptive_loss: false

# Training Configuration
training:
  # Optimization
  learning_rate: 1e-4
  weight_decay: 1e-5
  batch_size: 128
  max_epochs: 100

  # Regularization
  grad_clip_norm: 1.0

  # Early stopping
  patience: 20
  monitor_metric: "sharpe_ratio"  # or "loss"

  # Learning rate scheduling
  use_cosine_annealing: true
  lr_min_factor: 0.01  # min_lr = lr * lr_min_factor

  # Mixed precision training (GPU only)
  use_amp: true

  # Checkpointing
  checkpoint_dir: "./checkpoints"
  save_best_only: false

# Evaluation Configuration
evaluation:
  # Metrics computation
  initial_capital: 1.0
  risk_free_rate: 0.02  # 2% annual

  # Walk-forward validation
  walk_forward:
    enabled: false
    train_window_size: 10000
    test_window_size: 1000
    step_size: 1000
    max_windows: null  # null = all windows

  # Backtesting
  generate_plots: true
  plot_dir: "./plots"

# Robustness Testing
robustness:
  # Test 1: Timeframe change
  test_timeframes: true
  aggregation_factors: [5, 15]  # 5-min, 15-min

  # Test 2: Noise injection
  test_noise: true
  noise_levels: [0.0005, 0.001, 0.002]

  # Test 3: Data reduction
  test_data_reduction: false  # Requires retraining
  data_fractions: [0.1, 0.25, 0.5, 1.0]

  # Test 4: Asset transfer
  test_asset_transfer: false  # Requires multi-asset data
  transfer_assets: ["ETHUSDT", "BNBUSDT", "SOLUSDT"]

  # Test 5: Crisis periods
  test_crisis: true
  volatility_threshold: 0.005

# Hardware Configuration
hardware:
  device: "auto"  # "auto", "cuda", "cpu"
  num_workers: 0  # DataLoader workers
  pin_memory: true

# Logging Configuration
logging:
  level: "INFO"  # "DEBUG", "INFO", "WARNING", "ERROR"
  log_file: "./logs/trm_training.log"
  log_to_console: true
  tensorboard: false
  tensorboard_dir: "./runs"

# Random Seed (for reproducibility)
seed: 42
