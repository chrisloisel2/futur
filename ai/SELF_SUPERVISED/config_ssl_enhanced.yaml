# Enhanced SSL Configuration with Multiple Encoders and Objectives

# Data configuration
data:
  source: mongodb  # 'mongodb' or 'parquet'
  mongo_uri: "mongodb+srv://christoloisel:rose@cluster0.ppyauvl.mongodb.net/"
  db_name: "trader2"
  collection_name: "historical_ohlcv"
  symbols: ["BTC/USDT", "ETH/USDT", "BNB/USDT"]
  limit: null

  sequence_length: 100
  stride: 1
  train_ratio: 0.8

# Model configuration
model:
  input_dim: 8
  d_model: 256
  projection_dim: 128

  # Encoder configuration
  encoder_type: "transformer"  # 'transformer', 'timesnet', 'multimodal'
  n_heads: 8
  n_layers: 4
  dropout: 0.1

  # SSL objective
  ssl_objective: "contrastive"  # 'masked', 'contrastive', 'next_patch'

  # Masked modeling parameters
  mask_ratio: 0.3  # 20-40% masking

  # Next patch prediction parameters
  patch_len: 16

# Training configuration
training:
  batch_size: 64
  epochs: 100
  lr: 0.001
  weight_decay: 0.00001
  device: "auto"
  num_workers: 4
  save_every: 10

# Configurations for each combination

# A. Masked Modeling + Transformer
masked_transformer:
  encoder_type: "transformer"
  ssl_objective: "masked"
  mask_ratio: 0.3
  n_layers: 6

# B. Contrastive + TimesNet
contrastive_timesnet:
  encoder_type: "timesnet"
  ssl_objective: "contrastive"
  n_layers: 4

# C. Next Patch + MultiModal
next_patch_multimodal:
  encoder_type: "multimodal"
  ssl_objective: "next_patch"
  patch_len: 16
  n_layers: 4

# Checkpoints
checkpoints:
  base_dir: "./checkpoints"
