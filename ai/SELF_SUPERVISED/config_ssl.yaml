# Configuration for Self-Supervised Learning

# Data configuration
data:
  source: mongodb  # 'mongodb' or 'parquet'
  mongo_uri: "mongodb+srv://christoloisel:rose@cluster0.ppyauvl.mongodb.net/"
  db_name: "trader2"
  collection_name: "historical_ohlcv"
  symbols: ["BTC/USDT", "ETH/USDT", "BNB/USDT"]
  limit: null  # null = load all

  # For parquet source
  # source: parquet
  # file_path: "../PIPELINE/datasets/alpha_trading/dataset_20231215_143000/coingecko_minutely.parquet"

  sequence_length: 100
  stride: 1
  train_ratio: 0.8

# Training configuration
training:
  batch_size: 64
  epochs: 100
  lr: 0.001
  weight_decay: 0.00001
  device: "auto"  # 'auto', 'mps', 'cuda', 'cpu'
  num_workers: 4
  save_every: 10

# TS2Vec configuration
ts2vec:
  input_dim: 8  # Will be auto-detected from data
  hidden_dim: 64
  output_dim: 320
  depth: 10
  kernel_size: 3
  temperature: 0.2
  temporal_unit: 0

# MAE configuration
mae:
  input_dim: 8
  d_model: 256
  n_heads: 8
  n_layers: 6
  decoder_depth: 2
  dropout: 0.1
  mask_ratio: 0.75
  masking_strategy: "random"  # 'random', 'block', 'geometric', 'structured'
  masking_kwargs:
    block_length: 10
    mean_block_length: 10
    period: 24

# SimCLR configuration
simclr:
  input_dim: 8
  hidden_dim: 256
  projection_dim: 128
  depth: 6
  temperature: 0.5

# Checkpoints
checkpoints:
  ts2vec_dir: "./checkpoints/ts2vec"
  mae_dir: "./checkpoints/mae"
  simclr_dir: "./checkpoints/simclr"
