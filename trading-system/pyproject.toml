[project]
name = "trading-system"
version = "0.1.0"
description = "Research and validation pipeline"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1",
  "pydantic>=2.6",
  "pyarrow>=12.0",
  "pyyaml>=6.0",
  "pymongo>=4.6",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
