[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "institutional"
version = "0.1.0"
requires-python = ">=3.11"
description = "INSTITUTIONAL_ENGINE — moteur algorithmique institutionnel"
dependencies = []   # stdlib uniquement pour les contrats

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths  = ["tests"]
addopts    = "-v --tb=short"
pythonpath = ["src"]

[tool.mypy]
python_version  = "3.11"
strict          = true
warn_return_any = true

[tool.ruff]
target-version = "py311"
line-length    = 100
