app: trading-system
version: 0.1.0

data_layer:
  ingest_run_id: 20240101_000000_ingest
  payload_version: 1
  mongo_buffer:
    uri: mongodb://localhost:27017
    db: market
    collection: buffer_events
    ttl_seconds: 7200
  s3_lake:
    bucket: my-bucket
    prefix: s3://my-bucket
  schemas:
    raw: data/schemas/raw_event_stream.avsc
    clean: data/schemas/clean_event_stream.avsc
  partitioning:
    columns: [dt, symbol, venue, source]
  watermarks:
    max_lateness_ms: 5000
  resampling:
    default_freq: 1min

exchange:
  binance:
    symbol_map:
      BTCUSDT: BTCUSDT
    channels: [trades, book, ohlcv]
    rate_limits:
      weight_per_min: 1200
    reconnect:
      backoff_s: 5
      max_backoff_s: 60
  bybit:
    symbol_map:
      BTCUSDT: BTCUSDT
    channels: [trades, book]
    rate_limits:
      weight_per_min: 800
    reconnect:
      backoff_s: 5
      max_backoff_s: 60
  okx:
    symbol_map:
      BTC-USDT: BTCUSDT
    channels: [trades, book]
    rate_limits:
      weight_per_min: 600
    reconnect:
      backoff_s: 5
      max_backoff_s: 60
  deribit:
    symbol_map:
      BTC-26JUL24-40000-C: BTCUSDT
    channels: [trades, book]
    rate_limits:
      weight_per_min: 400
    reconnect:
      backoff_s: 5
      max_backoff_s: 60
