# config/default.yaml — Hyperparamètres centralisés du pipeline
# ================================================================
# Source de vérité pour les valeurs par défaut.
# Toutes les valeurs ici correspondent aux defaults des dataclasses Python.
# Ne modifier que pour expérimenter — les classes Python restent autoritaires.

pipeline:
  mode: combined           # "long" | "short" | "combined"
  tradeable_quantile: 0.75  # ~25% des barres retenues comme tradeables
  cost_pct: 0.001           # 10 bps aller-retour
  test_from: 2024           # première année du test set

labels:
  gray_zone_factor: 0.15    # zone grise = [thr, thr*(1+0.15)]
                             # Mettre à 0.0 pour désactiver

filter:
  lr_C: 0.1
  xgb_n_estimators: 300
  xgb_max_depth: 4
  xgb_learning_rate: 0.05
  calibration_beta_long: 1.5   # F-beta pour calibration seuil long
  calibration_beta_short: 1.0  # F-beta pour calibration seuil short
  min_recall_tradeable: 0.15   # alerte si recall < seuil

long:
  seed: 42
  # Logistic Regression
  lr_C: 0.1
  lr_max_iter: 2000
  lr_solver: lbfgs
  # XGBoost
  xgb_n_estimators: 600
  xgb_max_depth: 4
  xgb_learning_rate: 0.04
  xgb_subsample: 0.80
  xgb_colsample_bytree: 0.70
  xgb_reg_alpha: 0.10
  xgb_reg_lambda: 1.50
  xgb_min_child_weight: 20
  # TCN
  tcn_enabled: false   # activer uniquement si AUC tabulaire > 0.63
  tcn_lookback: 64
  tcn_d_model: 128
  tcn_n_layers: 4
  tcn_dropout: 0.10
  tcn_epochs: 40
  tcn_batch_size: 128
  tcn_learning_rate: 0.0002
  tcn_patience: 7
  # Critères d'acceptation
  min_macro_f1: 0.54
  min_auc: 0.62

short:
  seed: 42
  # Logistic Regression — régularisation plus forte
  lr_C: 0.05
  lr_max_iter: 2000
  lr_solver: lbfgs
  # XGBoost — plus conservateur
  xgb_n_estimators: 400
  xgb_max_depth: 3
  xgb_learning_rate: 0.03
  xgb_subsample: 0.70
  xgb_colsample_bytree: 0.60
  xgb_reg_alpha: 0.30
  xgb_reg_lambda: 2.00
  xgb_min_child_weight: 30
  # TCN — désactivé par défaut
  tcn_enabled: false
  # Critères
  min_macro_f1: 0.52
  min_auc: 0.62
  # Validation inter-années
  require_yearly_stability: true
  min_pf_per_year: 0.80
  min_wr_per_year: 0.40
  max_bad_years_allowed: 1

risk_long:
  position_size_pct: 0.02
  stop_loss_pct: 0.015
  take_profit_pct: 0.025
  risk_reward_ratio: 1.67
  cooldown_bars: 3
  cooldown_after_loss: 6
  max_consecutive_losses: 4
  max_daily_drawdown_pct: 0.03
  max_total_drawdown_pct: 0.10
  min_abs_edge: 0.45
  rv_key: rv_24   # IMPORTANT: pas rv_60 — cette colonne n'existe pas dans le CSV

risk_short:
  position_size_pct: 0.015   # plus petit qu'en long
  stop_loss_pct: 0.012        # stop plus serré
  take_profit_pct: 0.024
  risk_reward_ratio: 2.0      # RR plus exigeant
  cooldown_bars: 5            # récupération plus lente
  cooldown_after_loss: 10
  max_consecutive_losses: 3   # stoppe plus tôt
  max_daily_drawdown_pct: 0.02
  max_total_drawdown_pct: 0.08
  min_abs_edge: 0.50
  rv_key: rv_24
