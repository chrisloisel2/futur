name: futur

services:
  # ── stockage ───────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: futur-mongodb
    restart: unless-stopped
    ports:
      - "0.0.0.0:27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: futur-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── front : COMMAND CENTER (PWA) ───────────────────────────────────────────
  # Port 90 dans le conteneur (cible du tunnel ngrok), 8899 côté hôte.
  # Le dépôt est bind-monté : reports/ et data/ sont alimentés en continu par
  # les services systemd hôte ; le HTML/py se modifie sans rebuild d'image.
  command-center:
    build: ./frontend_pipeline
    image: futur-command-center
    container_name: futur-command-center
    restart: unless-stopped
    ports:
      - "0.0.0.0:8899:90"
    environment:
      MONGO_URL: mongodb://mongodb:27017
      TZ: Europe/Paris
    volumes:
      - .:/app
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:90/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── tunnel ngrok → https://futur.ngrok-free.app ────────────────────────────
  # « command-center:90 » = le port 90 de l'app sur le réseau compose
  # (équivalent de `ngrok http 90` lancé depuis le conteneur de l'app).
  # NGROK_AUTHTOKEN vient du fichier .env (gitignoré) ; NGROK_URL est
  # surchargeable pour pointer un autre domaine réservé.
  # État du tunnel : `docker compose logs -f ngrok` ou l'inspecteur
  # http://127.0.0.1:4041 (requêtes entrantes, rejeu). 4041 côté hôte car
  # 4040 est déjà pris par l'agent ngrok hôte du projet konfirm.
  ngrok:
    image: ngrok/ngrok:3
    container_name: futur-ngrok
    restart: unless-stopped
    ports:
      - "127.0.0.1:4041:4040"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?NGROK_AUTHTOKEN manquant — à définir dans .env}
    command:
      - "http"
      - "command-center:90"
      - "--url"
      - "${NGROK_URL:-https://futur.ngrok-free.app}"
      - "--log"
      - "stdout"
    depends_on:
      command-center:
        condition: service_healthy

volumes:
  mongodb_data:
  mongodb_config:
  qdrant_storage:
