fees:
  sources_available: no historical signed snapshots exist anywhere
    (data/alpha20/cost_snapshots/ does not exist on qbee, confirmed
    repeatedly across pistes this session). exchangeInfo exposes a
    per-symbol liquidationFee field (current value only, e.g. checked
    BTCUSDT) that could inform a liquidation-specific cost assumption, not
    yet used by any existing cost model.
  classification: COLLECTOR_REQUIRED for real snapshots (needs signed API
    keys, out of scope) -- assumed defaults from configs/alpha20.yaml
    (binance_usdm: maker 2bp, taker 5bp) remain the only usable figures,
    same limitation as every other piste this session

tick_size_lot_size:
  sources_available: fapi/v1/exchangeInfo (free, live, no auth) returns
    CURRENT PRICE_FILTER.tickSize and LOT_SIZE.stepSize per symbol (verified
    on BTCUSDT: tickSize 0.10, stepSize 0.001) -- but only current values,
    no historical archive. Tick/lot size can and does change over an
    instrument's life (price appreciation, exchange adjustments); using
    today's value for a 2023 event would be an unverified assumption, not a
    fact.
  classification: DATA_READY_WITH_CAVEAT (current values only, historical
    values not reproducible)

overall_bottleneck: >
  the preregistered 5-minute-bar cascade detector needs perp 5m OHLCV +
  aggressive volume + 5m OI + basis divergence, simultaneously, across the
  full 311-symbol PIT universe. As inventoried: perp 5m OHLCV does not
  exist at all (COLLECTOR_REQUIRED, real build cost, not a quick re-run);
  aggTrades does not exist at all (COLLECTOR_REQUIRED, same); 5m OI exists
  for 49/311 symbols today but is cheaply extensible (COLLECTOR_REQUIRED,
  low cost); true mark/spot at 5m does not exist anywhere
  (BLOCKED_BY_REFERENCE_SPOT, premium-ratio is a partial substitute for the
  divergence signal only). Funding and listing/delisting are fully
  DATA_READY. Liquidations are DATA_READY_WITH_INFERRED_LIQUIDATIONS by
  design. Net: nothing here is NOT_REPRODUCIBLE, but running the full
  311-symbol universe today would require building and running two new
  collectors (perp 5m OHLCV, aggTrades) from scratch, not just re-invoking
  existing tools -- a materially larger effort than any prior piste's step
  3 this session, which mostly found existing collectors to re-run.
