experiment_id: funding_relative_value_cross_venue_v1
step: 3 — data inventory (no collector, no feature, no backtest run)
date: 2026-07-21
machine: qbee@100.127.59.114, read-only inspection, ~/futur (data dirs are gitignored,
  independent of whatever branch happens to be checked out)

sources_available:
  funding_rate:
    binance: data/derivatives_backfill/binance/funding/*.parquet
    bybit: data/derivatives_backfill/bybit/funding/*.parquet
    hyperliquid: data/derivatives_backfill/hyperliquid/funding/*.parquet
  perp_price:
    binance: >
      fragmented across data/derivatives_backfill/binance/{um_klines_1d,binance_vision_premium}
      (daily klines + 5m premium); real mark_price only from 2023-10-31
    bybit: none on disk
    hyperliquid: live ctxs/l2/trades collector, 2026-07-18 to present only (4 days)
  prior_art:
    - path: scripts/test_funding_xvenue_v0.py, reports/FUNDING_XVENUE_PROTOCOL.md,
        reports/FUNDING_XVENUE_V0_VERDICT.json
      status: one-shot test executed 2026-07-18/19, verdict NO_EDGE, sleeve closed
        (Binance-vs-Hyperliquid, Binance-vs-Bybit; BTC/ETH/SOL only)
      reuse: >
        timestamp-alignment fix already found and documented — exact-ms join matched only
        ~65% of settlements; fix = round to hour + align by interval between consecutive
